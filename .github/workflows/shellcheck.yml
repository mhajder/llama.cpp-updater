name: Shell Script Quality Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  sh-checker:
    name: Code Analysis
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Run the sh-checker
      uses: luizm/action-sh-checker@v0.10.0
      env:
        SHFMT_OPTS: -s -i 4
