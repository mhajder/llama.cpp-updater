fail_fast: false
minimum_prek_version: "0.5.0"
default_install_hook_types: [ pre-push, commit-msg, pre-commit ]
# Hooks that do not set their own stages run on commit only, not on the
# commit message file
default_stages: [ pre-commit ]

repos:
  - repo: meta
    hooks:
      - id: identity
        name: Print checked files
        description: Print input to the static check hooks for troubleshooting
        stages: [manual]

  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-yaml
        args: [ --allow-multiple-documents ]
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: detect-private-key
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-illegal-windows-names
      - id: forbid-new-submodules
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [ --maxkb=100 ]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
        args: [ "-i", "4", "-s", "-w" ]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/crate-ci/typos
    rev: v1.52.1
    hooks:
      - id: typos
        args: [ --force-exclude ]

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.3
    hooks:
      - id: commitizen
      - id: commitizen-branch
        stages:
          - pre-push
